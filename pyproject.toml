[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aiguard"
version = "0.1.0"
description = "Static analyzer that audits AI-generated Python code before you ship it"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Jude", email = "judd69@users.noreply.github.com" }]
keywords = ["static-analysis", "ai-generated-code", "security", "linter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
aiguard = "aiguard.cli:main"

[project.urls]
Homepage = "https://github.com/judd69/daily-project-2026-10-20-ai-code-audit"

[tool.setuptools.packages.find]
include = ["aiguard*"]
